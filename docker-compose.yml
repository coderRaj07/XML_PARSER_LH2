services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xml_feeds
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.23
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "*"
    depends_on:
      - temporal

  temporal-admin:
    image: temporalio/admin-tools:1.23
    profiles:
      - debug
    depends_on:
      - temporal

  init-db:
    build: .
    command: python -m alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: xml-feeds
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      init-db:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Each queue runs in its own process for true parallelism.
  # Scale independently, e.g.:
  #   docker compose up -d --scale fetch-worker=3 --scale parse-worker=2 --scale summarize-worker=2
  workflow-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: workflow
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: xml-feeds
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      init-db:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy

  url-workflow-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: url-workflow
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: xml-feeds
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      init-db:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy

  fetch-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: fetch
      FETCH_WORKERS: "${FETCH_WORKERS:-50}"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: xml-feeds
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      init-db:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy

  parse-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: parse
      PARSE_WORKERS: "${PARSE_WORKERS:-50}"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: xml-feeds
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      init-db:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy

  enrichment-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: enrichment
      ENRICHMENT_WORKERS: "${ENRICHMENT_WORKERS:-10}"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: xml-feeds
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      init-db:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy

  summarize-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: summarize
      SUMMARIZE_WORKERS: "${SUMMARIZE_WORKERS:-10}"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: xml-feeds
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      init-db:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
