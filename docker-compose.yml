services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xml_feeds
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.23
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "*"
    depends_on:
      - temporal

  temporal-admin:
    image: temporalio/admin-tools:1.23
    profiles:
      - debug
    depends_on:
      - temporal

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  # Each queue runs in its own process for true parallelism.
  # Scale independently, e.g.:
  #   docker compose up -d --scale fetch-worker=3 --scale parse-worker=2 --scale summarize-worker=2
  workflow-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: workflow
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  fetch-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: fetch
      FETCH_WORKERS: "${FETCH_WORKERS:-5}"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  parse-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: parse
      PARSE_WORKERS: "${PARSE_WORKERS:-5}"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  summarize-worker:
    build: .
    command: python -m src.infrastructure.temporal.run_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/xml_feeds
      TEMPORAL_HOST: temporal:7233
      LOG_LEVEL: INFO
      QUEUE: summarize
      SUMMARIZE_WORKERS: "${SUMMARIZE_WORKERS:-5}"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

volumes:
  pgdata:
