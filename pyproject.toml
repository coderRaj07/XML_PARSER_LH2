[project]
name = "xml-feed-summarizer"
version = "0.1.0"
description = "XML Feed Processing and Summarization System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "temporalio>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "aiohttp>=3.9.0",
    "sumy>=0.11.0",
    "nltk>=3.8.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "uvicorn>=0.24.0",
    "python-dateutil>=2.8.0",
    "feedparser>=6.0.0",
    "lxml>=4.9.0",
    "trafilatura>=2.0.0",
    "boto3>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
